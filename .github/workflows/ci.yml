name: CI

# Gates, in order: build, unit tests, and the differential oracle against
# the real compiler. The parser's own conformance and resilience corpus
# gates live in its own repository now (github.com/konimarti/parser.c3l),
# not here.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install c3c
        run: |
          # Pulls the latest Linux release of the c3c compiler. The asset
          # name has changed before between c3c releases; adjust the
          # download URL here if this step starts failing.
          curl -fsSL -o c3c.tar.gz \
            "https://github.com/c3lang/c3c/releases/latest/download/c3-linux.tar.gz"
          mkdir -p "$HOME/.local"
          tar -xzf c3c.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/c3" >> "$GITHUB_PATH"

      - name: Install c3l and fetch lexer.c3l
        run: |
          curl -fsSL -o c3l.tar.gz \
            "https://github.com/konimarti/c3l/releases/latest/download/c3l-linux-x64.tar.gz"
          mkdir -p "$HOME/.local/c3l"
          tar -xzf c3l.tar.gz --strip-components=1 -C "$HOME/.local/c3l"
          echo "$HOME/.local/c3l" >> "$GITHUB_PATH"
          "$HOME/.local/c3l/c3l" sync

      - name: c3c build
        run: c3c build

      - name: c3c test
        run: c3c test

  differential-oracle:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install c3c
        run: |
          curl -fsSL -o c3c.tar.gz \
            "https://github.com/c3lang/c3c/releases/latest/download/c3-linux.tar.gz"
          mkdir -p "$HOME/.local"
          tar -xzf c3c.tar.gz -C "$HOME/.local"
          echo "$HOME/.local/c3" >> "$GITHUB_PATH"

      - name: Install c3l and fetch lexer.c3l
        run: |
          curl -fsSL -o c3l.tar.gz \
            "https://github.com/konimarti/c3l/releases/latest/download/c3l-linux-x64.tar.gz"
          mkdir -p "$HOME/.local/c3l"
          tar -xzf c3l.tar.gz --strip-components=1 -C "$HOME/.local/c3l"
          echo "$HOME/.local/c3l" >> "$GITHUB_PATH"
          "$HOME/.local/c3l/c3l" sync

      - name: Check out the c3c compiler source (the conformance corpus)
        uses: actions/checkout@v4
        with:
          repository: c3lang/c3c
          path: c3c-checkout

      - name: c3c build
        run: c3c build

      - name: Differential oracle -- zero overlap with the real compiler
        env:
          C3C_CHECKOUT: ${{ github.workspace }}/c3c-checkout
        run: scripts/differential-oracle.sh
