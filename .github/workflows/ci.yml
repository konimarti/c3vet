name: CI

# Gates, in order: build and unit tests on Linux, macOS and Windows, and the
# differential oracle against the real compiler. The parser's own conformance
# and resilience corpus gates live in its own repository now
# (github.com/konimarti/parser.c3l), not here. A v* tag also publishes the
# binaries as a GitHub release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  C3C_RELEASE: v0.8.6

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64, c3c: c3-linux.tar.gz }
          - { os: macos-15, target: macos-aarch64, c3c: c3-macos.zip }
          - { os: windows-2022, target: windows-x64, c3c: c3-windows.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install c3c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$C3C_RELEASE" -R c3lang/c3c -p '${{ matrix.c3c }}'
          case '${{ matrix.c3c }}' in
            *.tar.gz) tar xzf '${{ matrix.c3c }}' ;;
            *) if [ "$RUNNER_OS" = Windows ]; then 7z x -y -bd '${{ matrix.c3c }}' >/dev/null; else unzip -q '${{ matrix.c3c }}'; fi ;;
          esac
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"

      # a single executable on Windows, with the C runtime linked in
      - name: c3c build
        run: if [ "$RUNNER_OS" = Windows ]; then c3c build c3vet --wincrt=static; else c3c build c3vet; fi

      - name: c3c test
        run: c3c test

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "c3vet ${GITHUB_REF_NAME#v}" = "$(build/c3vet --version | tr -d '\r')"

      - name: Package
        run: |
          dir=c3vet-${{ matrix.target }}
          mkdir "$dir"
          cp README.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/c3vet.exe "$dir"/
            7z a -bd "$dir.zip" "$dir" >/dev/null
          else
            cp build/c3vet c3vet.1 "$dir"/
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: c3vet-${{ matrix.target }}
          path: c3vet-${{ matrix.target }}.*

  differential-oracle:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install c3c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$C3C_RELEASE" -R c3lang/c3c -p c3-linux.tar.gz
          tar xzf c3-linux.tar.gz
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"

      - name: Check out the c3c compiler source (the conformance corpus)
        uses: actions/checkout@v4
        with:
          repository: c3lang/c3c
          path: c3c-checkout

      - name: c3c build
        run: c3c build

      - name: Differential oracle -- zero overlap with the real compiler
        env:
          C3C_CHECKOUT: ${{ github.workspace }}/c3c-checkout
        run: scripts/differential-oracle.sh

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test, differential-oracle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum c3vet-*.tar.gz c3vet-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes c3vet-*.tar.gz c3vet-*.zip SHA256SUMS
